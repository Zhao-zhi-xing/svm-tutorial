project:
  type: book
  output-dir: _book
  execute-dir: project
  render:
  - index.qmd
  - chapters/01-geometry.qmd
  - chapters/01-hard-margin.qmd
  - chapters/02-soft-margin.qmd
  - chapters/03-optimization.qmd
  - chapters/03-duality-smo.qmd
  - chapters/04-kernels.qmd
  - chapters/04-rkhs.qmd
  - chapters/03-smo.qmd
  - chapters/05-multiclass.qmd
  - chapters/06-workflow.qmd
  - chapters/00-python-start.qmd
  - chapters/07-cases.qmd
  - chapters/08-modern.qmd
  - references.qmd
  resources:
  - /assets/**
  - /data/**
  - /notebooks/**
  - requirements-notebook.txt
  - requirements-notebook.lock.txt
  - reports/validation.json
  - '!/.R-library/**'
  - '!/.tools/**'
  - '!/.venv/**'
book:
  title: 支持向量机教程：从几何到现代学习
  subtitle: Python / R 实验与交互式探索
  author: 赵知行
  date: '2026-10-03'
  language: zh
  search: true
  navbar:
    title: false
    background: white
    right:
    - text: 首页
      href: index.qmd
    - text: 教程
      href: chapters/01-geometry.qmd
    - icon: github
      href: https://github.com/Zhao-zhi-xing/svm-tutorial
      aria-label: GitHub 源码
  sidebar:
    title: 支持向量机教程
    style: docked
    header: <div class='tutorial-brand'>支持向量机教程</div><div class='tutorial-directory-label'>目录</div>
    collapse-level: 1
  chapters:
  - href: index.qmd
    text: 导读与学习路线
  - href: chapters/01-geometry.qmd
    text: 分类与超平面
  - href: chapters/01-hard-margin.qmd
    text: 间隔与硬间隔
  - href: chapters/02-soft-margin.qmd
    text: 软间隔与正则化
  - href: chapters/03-optimization.qmd
    text: 约束优化与 KKT
  - href: chapters/03-duality-smo.qmd
    text: SVM 对偶与解
  - href: chapters/04-kernels.qmd
    text: 映射与核技巧
  - href: chapters/04-rkhs.qmd
    text: 核的函数空间
  - href: chapters/03-smo.qmd
    text: SMO 求解
  - href: chapters/05-multiclass.qmd
    text: 多分类
  - href: chapters/06-workflow.qmd
    text: 评估与模型选择
  - href: chapters/00-python-start.qmd
    text: Python / R 实践
  - href: chapters/07-cases.qmd
    text: 案例与模型比较
  - href: chapters/08-modern.qmd
    text: 现代研究导读
  - href: references.qmd
    text: 参考文献
lang: zh
bibliography: references.bib
csl: assets/ieee.csl
engine: knitr
execute:
  echo: true
  warning: false
  error: false
  cache: false
format:
  html:
    theme: cosmo
    css: assets/book.css
    page-layout: article
    grid:
      sidebar-width: 270px
      body-width: 1040px
      margin-width: 270px
      gutter-width: 2rem
    toc: true
    toc-title: 本章目录
    toc-depth: 2
    number-sections: true
    code-copy: true
    code-fold: false
    code-overflow: scroll
    html-math-method: mathjax
    include-in-header: assets/header.html
    include-after-body: assets/footer.html
    link-external-newwindow: true
    fig-responsive: true
