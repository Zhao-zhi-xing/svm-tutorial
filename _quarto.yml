project:
  type: book
  output-dir: _book
  execute-dir: project
  render:
    - index.qmd
    - chapters/*.qmd
    - references.qmd
  resources:
    - /assets/**
    - /data/**
    - /notebooks/**
    - requirements-notebook.txt
    - requirements-notebook.lock.txt
    - 使用VSCode制作与维护QuartoBook.md
    - MIGRATION.md
    - reports/validation.json
    - '!/.R-library/**'
    - '!/.tools/**'
    - '!/.venv/**'

book:
  title: "支持向量机教程：从几何到现代学习"
  subtitle: "Python / R 实验与交互式探索"
  author: "赵知行"
  date: "2026-10-02"
  language: zh
  search: true
  navbar:
    title: false
    background: white
    right:
      - text: "首页"
        href: index.qmd
      - text: "教程"
        href: chapters/00-python-start.qmd
      - icon: github
        href: https://github.com/Zhao-zhi-xing/svm-tutorial
        aria-label: "GitHub 源码"
  sidebar:
    title: "支持向量机教程"
    style: docked
    header: "<div class='tutorial-brand'>支持向量机教程</div><div class='tutorial-directory-label'>目录</div>"
    collapse-level: 1
  chapters:
    - index.qmd
    - chapters/00-python-start.qmd
    - chapters/01-geometry.qmd
    - chapters/02-soft-margin.qmd
    - chapters/03-duality-smo.qmd
    - chapters/04-kernels.qmd
    - chapters/05-multiclass.qmd
    - chapters/06-workflow.qmd
    - chapters/07-cases.qmd
    - chapters/08-modern.qmd
    - chapters/09-authoring.qmd
    - references.qmd

lang: zh
bibliography: references.bib
engine: knitr
execute:
  echo: true
  warning: false
  error: false
  cache: false
format:
  html:
    theme: cosmo
    css: assets/book.css
    page-layout: article
    grid:
      sidebar-width: 270px
      body-width: 1040px
      margin-width: 270px
      gutter-width: 2rem
    toc: true
    toc-title: "本章目录"
    toc-depth: 2
    number-sections: true
    code-copy: true
    code-fold: false
    code-overflow: wrap
    html-math-method: mathjax
    include-in-header: assets/header.html
    include-after-body: assets/footer.html
    link-external-newwindow: true
    fig-responsive: true
